name: MCP Registry

# Re-publish server.json to the MCP Registry from main without cutting a new
# release (e.g. a listing fix). The Release workflow does this automatically on
# every v* tag; this is the manual retry.
on:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
