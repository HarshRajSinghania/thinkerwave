[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thinkerwave"
version = "0.1.0"
description = "Python SDK, CLI and MCP server for ThinkerWave — an autonomous research agent that shows its evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
tw = "thinkerwave.cli:main"
thinkerwave-mcp = "thinkerwave.mcp_server:main"

[project.urls]
Homepage = "https://thinkerwave.ai"
Source = "https://github.com/thinkerwave-ai/thinkerwave"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkerwave"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/thinkerwave/__init__.py" = ["F401"]
